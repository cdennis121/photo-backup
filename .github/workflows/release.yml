name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import photobackup; print(photobackup.__version__)"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match __version__ $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Generate WPD COM wrappers
        run: python -c "import photobackup.devices.wpd as w; w._libs(); print('WPD wrappers generated')"

      - name: Build exe
        run: python -m PyInstaller build.spec --noconfirm

      - name: Zip
        id: zip
        shell: pwsh
        run: |
          $name = "PhotoBackup-${{ steps.version.outputs.version }}-windows-x64.zip"
          Compress-Archive -Path dist\PhotoBackup -DestinationPath $name
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: ${{ steps.zip.outputs.name }}

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -SimpleMatch "## [$version]" | Select-Object -First 1).LineNumber
          $notes = if ($start) {
            $rest = $lines[$start..($lines.Count - 1)]
            $end = ($rest | Select-String -Pattern '^## \[' | Select-Object -First 1).LineNumber
            if ($end) { $rest[0..($end - 2)] } else { $rest }
          } else { @("PhotoBackup $version") }
          $notes += @("", "Download the zip, extract it, and run PhotoBackup.exe. See the README for phone setup.")
          $notes -join "`n" | Out-File -Encoding utf8 notes.md
          gh release create "${{ github.ref_name }}" "${{ steps.zip.outputs.name }}" --title "PhotoBackup $version" --notes-file notes.md
