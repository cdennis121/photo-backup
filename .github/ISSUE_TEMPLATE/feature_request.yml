name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or need, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could PhotoBackup help?
